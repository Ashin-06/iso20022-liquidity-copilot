[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iso20022-liquidity-copilot"
version = "1.0.0"
description = "ISO 20022 RTGS queue with gridlock-resolving settlement engines and a BCBS 248 intraday liquidity stress simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx2>=2.0", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
liqcopilot = "liqcopilot.__main__:main"

[tool.setuptools]
packages = ["liqcopilot"]

[tool.setuptools.package-data]
liqcopilot = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["liqcopilot"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]  # Depends() defaults are FastAPI's idiom; zip(strict=) is style
